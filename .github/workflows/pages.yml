name: Deploy web app

# Publishes the app to GitHub Pages. Enable it once under
# Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the single-file offline copy
        run: node scripts/bundle-standalone.mjs

      - name: Build the Home Screen icons
        run: node scripts/make-icon.mjs

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp manifest.webmanifest _site/
          cp -r src _site/
          cp -r assets _site/
          cp build/standalone.html _site/offline.html
          # Pages serves 404.html for unknown paths; send visitors to the app.
          cp index.html _site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
